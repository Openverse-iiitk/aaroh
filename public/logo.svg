<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <linearGradient id="reflect-badge" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#27272a" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>
    <linearGradient id="reflect-metal" x1="6" y1="4" x2="26" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#d4d4d8" />
      <stop offset="100%" stop-color="#a1a1aa" />
    </linearGradient>
    <filter id="reflect-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#a855f7" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Outer circular badge with subtle border -->
  <circle cx="16" cy="16" r="15" fill="url(#reflect-badge)" stroke="#3f3f46" stroke-width="1" />
  
  <!-- Swirling double-crescent reflection mark -->
  <g filter="url(#reflect-glow)">
    <!-- Top-Right Swirl Lobe -->
    <path
      d="M16 5.5C21.8 5.5 26.5 10.2 26.5 16C26.5 18.2 25.8 20.3 24.5 21.9C23.8 22.8 22.5 23 21.6 22.3C20.7 21.6 20.5 20.3 21.2 19.4C22 18.4 22.5 17.2 22.5 16C22.5 12.4 19.6 9.5 16 9.5C13.2 9.5 10.8 11.2 9.9 13.7C9.5 14.7 8.3 15.2 7.3 14.8C6.3 14.4 5.8 13.2 6.2 12.2C7.7 8.3 11.5 5.5 16 5.5Z"
      fill="url(#reflect-metal)"
    />
    
    <!-- Bottom-Left Swirl Lobe (180deg rotational reflection) -->
    <path
      d="M16 26.5C10.2 26.5 5.5 21.8 5.5 16C5.5 13.8 6.2 11.7 7.5 10.1C8.2 9.2 9.5 9 10.4 9.7C11.3 10.4 11.5 11.7 10.8 12.6C10 13.6 9.5 14.8 9.5 16C9.5 19.6 12.4 22.5 16 22.5C18.8 22.5 21.2 20.8 22.1 18.3C22.5 17.3 23.7 16.8 24.7 17.2C25.7 17.6 26.2 18.8 25.8 19.8C24.3 23.7 20.5 26.5 16 26.5Z"
      fill="url(#reflect-metal)"
    />
  </g>
</svg>
